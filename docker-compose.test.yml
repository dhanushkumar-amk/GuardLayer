version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: guardlayer-postgres-test
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - guardlayer-network-test

  redis:
    image: redis:7-alpine
    container_name: guardlayer-redis-test
    restart: "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - guardlayer-network-test

  db-migrations:
    build:
      context: ./services/db-migrations
      dockerfile: Dockerfile
    container_name: guardlayer-db-migrations-test
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - guardlayer-network-test

  config-service:
    build:
      context: ./services/config-service
      dockerfile: Dockerfile
    container_name: guardlayer-config-service-test
    restart: "no"
    environment:
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-guardlayer-default-jwt-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:3001/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - guardlayer-network-test

  input-guard:
    build:
      context: ./services/input-guard
      dockerfile: Dockerfile
    container_name: guardlayer-input-guard-test
    restart: "no"
    environment:
      PORT: 8001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LITELLM_MODEL: gpt-3.5-turbo
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - guardlayer-network-test

  output-guard:
    build:
      context: ./services/output-guard
      dockerfile: Dockerfile
    container_name: guardlayer-output-guard-test
    restart: "no"
    environment:
      PORT: 8002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LITELLM_MODEL: gpt-3.5-turbo
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 45s
    networks:
      - guardlayer-network-test

  llm-proxy:
    build:
      context: ./services/llm-proxy
      dockerfile: Dockerfile
    container_name: guardlayer-llm-proxy-test
    restart: "no"
    environment:
      PORT: 8003
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:8003/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - guardlayer-network-test

  audit-service:
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    container_name: guardlayer-audit-service-test
    restart: "no"
    environment:
      PORT: 8004
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:8004/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - guardlayer-network-test

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: guardlayer-api-gateway-test
    restart: "no"
    environment:
      PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-guardlayer-default-jwt-secret-key}
      CONFIG_SERVICE_URL: http://config-service:3001
      INPUT_GUARD_URL: http://input-guard:8001
      OUTPUT_GUARD_URL: http://output-guard:8002
      LLM_PROXY_URL: http://llm-proxy:8003
      AUDIT_SERVICE_URL: http://audit-service:8004
    depends_on:
      config-service:
        condition: service_healthy
      input-guard:
        condition: service_healthy
      output-guard:
        condition: service_healthy
      llm-proxy:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:8080/health', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - guardlayer-network-test

  integration-tests:
    build:
      context: .
      dockerfile: tests/integration/Dockerfile
    container_name: guardlayer-integration-tests
    depends_on:
      api-gateway:
        condition: service_healthy
      config-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      input-guard:
        condition: service_healthy
      output-guard:
        condition: service_healthy
      llm-proxy:
        condition: service_healthy
    networks:
      - guardlayer-network-test

networks:
  guardlayer-network-test:
    driver: bridge
