services:
  postgres:
    image: postgres:15
    container_name: guardlayer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: guardlayer-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s

  db-migrations:
    build:
      context: ./services/db-migrations
      dockerfile: Dockerfile
    container_name: guardlayer-db-migrations
    restart: on-failure
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    depends_on:
      postgres:
        condition: service_healthy

  config-service:
    build:
      context: ./services/config-service
      dockerfile: Dockerfile
    container_name: guardlayer-config-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: guardlayer-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET: ${JWT_SECRET:-guardlayer-default-jwt-secret-key}
      CONFIG_SERVICE_URL: http://config-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-service:
        condition: service_healthy

  input-guard:
    build:
      context: ./services/input-guard
      dockerfile: Dockerfile
    container_name: guardlayer-input-guard
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      LITELLM_MODEL: gpt-3.5-turbo
    depends_on:
      redis:
        condition: service_healthy

  output-guard:
    build:
      context: ./services/output-guard
      dockerfile: Dockerfile
    container_name: guardlayer-output-guard
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      LITELLM_MODEL: gpt-3.5-turbo
    depends_on:
      redis:
        condition: service_healthy

  llm-proxy:
    build:
      context: ./services/llm-proxy
      dockerfile: Dockerfile
    container_name: guardlayer-llm-proxy
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      PORT: 8003

volumes:
  postgres_data:
    driver: local
